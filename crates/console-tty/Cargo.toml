[package]
name = "console-tty"
description = "A local terminal rendered in your browser's DevTools console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ghostty-vt = { package = "libghostty-vt", version = "0.2.1", git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "a28e4ad00d6ba79b98b8cac651ed8976d8500903", default-features = false }
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0"
hex = "0.4"
portable-pty = "=0.9.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.48", features = ["full"] }
toml = "0.9"
uuid = { version = "1.18", features = ["v4", "serde"] }
which = "8.0"

[target.'cfg(windows)'.dependencies]
dunce = "1.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Pipes"] }
winreg = "0.55"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
